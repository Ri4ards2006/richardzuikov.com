<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Center hub via -->
  <circle cx="32" cy="36" r="3.5" stroke="currentColor" stroke-width="1.75" />
  <circle cx="32" cy="36" r="1.25" fill="currentColor" />

  <!-- Main Compass Spines -->
  <!-- North (Elongated: y 32.5 -> 7.5) -->
  <line x1="32" y1="32.5" x2="32" y2="7.5" stroke="currentColor" stroke-width="2" stroke-linecap="square" />
  <!-- South (y 39.5 -> 56.5) -->
  <line x1="32" y1="39.5" x2="32" y2="56.5" stroke="currentColor" stroke-width="2" stroke-linecap="square" />
  <!-- West (x 28.5 -> 9.5) -->
  <line x1="28.5" y1="36" x2="9.5" y2="36" stroke="currentColor" stroke-width="2" stroke-linecap="square" />
  <!-- East (x 35.5 -> 54.5) -->
  <line x1="35.5" y1="36" x2="54.5" y2="36" stroke="currentColor" stroke-width="2" stroke-linecap="square" />

  <!-- Terminal Vias at Compass Points -->
  <!-- North Via (Primary) -->
  <circle cx="32" cy="6" r="3.25" stroke="currentColor" stroke-width="1.75" />
  <circle cx="32" cy="6" r="1" fill="currentColor" />
  <!-- South Via -->
  <circle cx="32" cy="58" r="2.75" stroke="currentColor" stroke-width="1.5" />
  <circle cx="32" cy="58" r="0.9" fill="currentColor" />
  <!-- West Via -->
  <circle cx="8" cy="36" r="2.75" stroke="currentColor" stroke-width="1.5" />
  <circle cx="8" cy="36" r="0.9" fill="currentColor" />
  <!-- East Via -->
  <circle cx="56" cy="36" r="2.75" stroke="currentColor" stroke-width="1.5" />
  <circle cx="56" cy="36" r="0.9" fill="currentColor" />

  <!-- Outer 45° Routed Trace Wings (Star Silhouette) -->
  <!-- North-West Wing -->
  <path d="M32 15 L22 25 L22 36" stroke="currentColor" stroke-width="1.5" stroke-linecap="square" stroke-linejoin="miter" />
  <circle cx="22" cy="25" r="1.75" fill="currentColor" />

  <!-- North-East Wing -->
  <path d="M32 15 L42 25 L42 36" stroke="currentColor" stroke-width="1.5" stroke-linecap="square" stroke-linejoin="miter" />
  <circle cx="42" cy="25" r="1.75" fill="currentColor" />

  <!-- South-West Wing -->
  <path d="M22 36 L22 43 L32 51" stroke="currentColor" stroke-width="1.5" stroke-linecap="square" stroke-linejoin="miter" />
  <circle cx="22" cy="43" r="1.75" fill="currentColor" />

  <!-- South-East Wing -->
  <path d="M42 36 L42 43 L32 51" stroke="currentColor" stroke-width="1.5" stroke-linecap="square" stroke-linejoin="miter" />
  <circle cx="42" cy="43" r="1.75" fill="currentColor" />

  <!-- Inner 45° Concentric Miter Diamond -->
  <path d="M32 24 L40 32 L40 36 L32 44 L24 36 L24 32 Z" stroke="currentColor" stroke-width="1.25" stroke-linejoin="miter" />

  <!-- Diagonal Satellite Test Via Pads -->
  <circle cx="27" cy="20" r="1.25" fill="currentColor" />
  <circle cx="37" cy="20" r="1.25" fill="currentColor" />
  <circle cx="27" cy="48" r="1.25" fill="currentColor" />
  <circle cx="37" cy="48" r="1.25" fill="currentColor" />
</svg>
