<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square" stroke-linejoin="miter">
  <!-- Outer Rim Ring -->
  <circle cx="24" cy="24" r="13" />

  <!-- Inner Hub Ring -->
  <circle cx="24" cy="24" r="5" />
  <circle cx="24" cy="24" r="1.5" fill="currentColor" stroke="none" />

  <!-- 8 Symmetrical Spokes with Projecting Handles (Every 45°) -->
  <!-- 0° (North) & 180° (South) -->
  <line x1="24" y1="5" x2="24" y2="19" />
  <line x1="24" y1="29" x2="24" y2="43" />

  <!-- 90° (East) & 270° (West) -->
  <line x1="5" y1="24" x2="19" y2="24" />
  <line x1="29" y1="24" x2="43" y2="24" />

  <!-- 45° (North-East) & 225° (South-West) -->
  <line x1="10.5" y1="10.5" x2="20.5" y2="20.5" />
  <line x1="27.5" y1="27.5" x2="37.5" y2="37.5" />

  <!-- 135° (South-East) & 315° (North-West) -->
  <line x1="37.5" y1="10.5" x2="27.5" y2="20.5" />
  <line x1="20.5" y1="27.5" x2="10.5" y2="37.5" />
</svg>