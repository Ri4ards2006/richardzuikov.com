<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square" stroke-linejoin="miter">
  <!-- Gjermundbu-style spectacle helmet, front view. Rounded cap, no horns. -->
  <!-- Cap -->
  <path d="M 9 26 C 9 14 16 6 24 6 C 32 6 39 14 39 26" />
  <!-- Crest ridge and cross band -->
  <line x1="24" y1="6" x2="24" y2="26" />
  <path d="M 10.5 17 C 15 14.5 33 14.5 37.5 17" />
  <!-- Brow rim -->
  <path d="M 8 26 L 40 26 L 40 29 L 8 29 Z" />
  <!-- Rivets on the rim -->
  <circle cx="12" cy="27.5" r="0.9" fill="currentColor" stroke="none" />
  <circle cx="36" cy="27.5" r="0.9" fill="currentColor" stroke="none" />
  <!-- Spectacle guard: outer plate with two eye openings, joined by the nose guard -->
  <path d="M 10.5 29 C 10.5 35.5 13.5 38.5 17.5 38.5 C 20.5 38.5 22.5 36.5 24 34 C 25.5 36.5 27.5 38.5 30.5 38.5 C 34.5 38.5 37.5 35.5 37.5 29" />
  <path d="M 14 29 C 14 33 15.5 35 17.5 35 C 19.5 35 21 33 21 29 Z" />
  <path d="M 27 29 C 27 33 28.5 35 30.5 35 C 32.5 35 34 33 34 29 Z" />
  <line x1="24" y1="34" x2="24" y2="42" />
</svg>
