<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square" stroke-linejoin="miter">
  <!-- Parchment Diploma Sheet with Mitered Corners -->
  <path d="M 11 6 L 37 6 L 40 9 L 40 39 L 37 42 L 11 42 L 8 39 L 8 9 Z" />

  <!-- Inner Diploma Border -->
  <rect x="12" y="10" width="24" height="28" />

  <!-- Certificate Heading Bar -->
  <line x1="16" y1="15" x2="32" y2="15" />

  <!-- Body Content Lines -->
  <line x1="16" y1="20" x2="32" y2="20" />
  <line x1="16" y1="24" x2="27" y2="24" />
  <line x1="16" y1="28" x2="23" y2="28" />

  <!-- Wax Seal in Bottom-Right Corner -->
  <circle cx="31" cy="31" r="5" stroke="currentColor" stroke-width="1.5" />
  <circle cx="31" cy="31" r="2.5" />
  <circle cx="31" cy="31" r="0.9" fill="currentColor" stroke="none" />

  <!-- Seal Ribbon Tails -->
  <path d="M 28 35 L 26 42 L 28 41 L 30 42 L 29.5 35" fill="currentColor" stroke="none" />
  <path d="M 32 35 L 32.5 42 L 34 41 L 35.5 42 L 34 35" fill="currentColor" stroke="none" />
</svg>