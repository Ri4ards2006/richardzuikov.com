<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square" stroke-linejoin="miter">
  <!-- QFP Package Body with pin 1 chamfer -->
  <path d="M 16 12 L 36 12 L 36 36 L 12 36 L 12 16 Z" />
  
  <!-- Pin 1 index dot -->
  <circle cx="16" cy="16" r="1.25" fill="currentColor" stroke="none" />
  
  <!-- Silicon Die Square -->
  <rect x="20" y="20" width="8" height="8" />
  <line x1="24" y1="22" x2="24" y2="26" />
  <line x1="22" y1="24" x2="26" y2="24" />

  <!-- Top Pins -->
  <line x1="16" y1="12" x2="16" y2="6" />
  <line x1="20" y1="12" x2="20" y2="6" />
  <line x1="24" y1="12" x2="24" y2="6" />
  <line x1="28" y1="12" x2="28" y2="6" />
  <line x1="32" y1="12" x2="32" y2="6" />

  <!-- Bottom Pins -->
  <line x1="16" y1="36" x2="16" y2="42" />
  <line x1="20" y1="36" x2="20" y2="42" />
  <line x1="24" y1="36" x2="24" y2="42" />
  <line x1="28" y1="36" x2="28" y2="42" />
  <line x1="32" y1="36" x2="32" y2="42" />

  <!-- Left Pins -->
  <line x1="12" y1="16" x2="6" y2="16" />
  <line x1="12" y1="20" x2="6" y2="20" />
  <line x1="12" y1="24" x2="6" y2="24" />
  <line x1="12" y1="28" x2="6" y2="28" />
  <line x1="12" y1="32" x2="6" y2="32" />

  <!-- Right Pins -->
  <line x1="36" y1="16" x2="42" y2="16" />
  <line x1="36" y1="20" x2="42" y2="20" />
  <line x1="36" y1="24" x2="42" y2="24" />
  <line x1="36" y1="28" x2="42" y2="28" />
  <line x1="36" y1="32" x2="42" y2="32" />
</svg>